version: "3.8"

services:
  api:
    build: .
    container_name: wavecask_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://wavecask_user:wavecask_password@db:5432/wavecask_db
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./sql:/app/sql
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg15
    container_name: raw_events_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: wavecask_user
      POSTGRES_PASSWORD: wavecask_password
      POSTGRES_DB: wavecask_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavecask_user -d wavecask_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wavecask_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data: